[package]
name = "Silf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
rustigram = "0.12"
tokio = { version = "1", features = [ "full" ] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
time = { version = "0.3", default-features = false, features = ["std"] }
migration = { path = "./migration" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
